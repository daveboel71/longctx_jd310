[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daveboel71-longctx_jd310"
version = "0.1.0"
description = "按结构键把条目聚类，标出长上下文优化工程师·冷启动与模型加载时间上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "daveboel71" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://daveboel71.github.io"
Repository = "https://github.com/daveboel71/longctx_jd310"
Issues = "https://github.com/daveboel71/longctx_jd310/issues"

[project.scripts]
longctx_jd310 = "longctx_jd310:main"

[tool.setuptools]
py-modules = ["longctx_jd310"]
